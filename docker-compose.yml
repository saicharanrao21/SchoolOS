version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: schoolos-postgres
    restart: always
    environment:
      POSTGRES_USER: schoolos_user
      POSTGRES_PASSWORD: schoolos_password
      POSTGRES_DB: schoolos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: schoolos-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
